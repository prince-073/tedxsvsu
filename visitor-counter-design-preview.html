<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#050505; --brand:#e62b1e; --text:#f6f1eb; --muted:rgba(255,255,255,.62); --font-mono:'Inter',sans-serif; --font-serif:'Cormorant Garamond',serif; --max:1240px; }
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:#151515;display:flex;align-items:end;color:var(--muted);font-family:Inter,Arial,sans-serif} .page{width:100%;background:var(--bg);padding-top:200px}.footer-section{border-top:0}footer{max-width:var(--max);margin:0 auto;padding:28px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;color:var(--muted);font-size:12px}.footer-copy{display:grid;gap:8px}.footer-copy p{margin:0}.footer-contact{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:rgba(255,255,255,.78);font-size:15px}.footer-contact .footer-email{color:var(--brand)}.visitor-count{display:inline-flex;align-items:center;gap:12px;width:fit-content;min-height:42px;padding:8px 14px 8px 12px;position:relative;overflow:hidden;border:.5px solid rgba(230,43,30,.42);background:radial-gradient(circle at 16% 50%,rgba(230,43,30,.22),transparent 42%),linear-gradient(135deg,rgba(230,43,30,.12),rgba(255,255,255,.025) 52%,rgba(0,0,0,.36));box-shadow:0 0 0 1px rgba(255,255,255,.025) inset,0 14px 34px rgba(230,43,30,.12)}.visitor-count:before{content:"";width:8px;height:8px;flex:0 0 auto;border-radius:999px;background:var(--brand);box-shadow:0 0 0 4px rgba(230,43,30,.12),0 0 22px rgba(230,43,30,.82)}.visitor-count:after{content:"";width:54px;height:1px;position:absolute;right:10px;bottom:8px;background:linear-gradient(90deg,transparent,rgba(230,43,30,.72))}.visitor-count__label{color:rgba(255,255,255,.58);font-family:var(--font-mono);font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.visitor-count__value{color:var(--text);font-family:var(--font-serif);font-size:24px;font-weight:600;line-height:1;letter-spacing:.02em;white-space:nowrap}.social-icons{display:flex;align-items:center;gap:18px}.social-icons a,footer a{position:relative;color:var(--muted);text-decoration:none;transition:color .2s ease}.social-icons a:hover,footer a:hover{color:var(--brand)}@media(max-width:768px){footer{padding:26px 22px;display:grid;gap:22px}.social-icons{gap:20px;flex-wrap:wrap}.footer-contact{font-size:13px}.visitor-count{min-height:40px;padding:8px 12px}.visitor-count__label{font-size:8px}.visitor-count__value{font-size:22px}}
</style>
</head>
<body><div class="page"><section class="footer-section"><footer><div class="footer-copy"><p>Copyright 2026 TEDx Shri Vishwakarma Skill University. All Rights Reserved.</p><p class="footer-contact">Contact: <a href="tel:+918920985602">+91 8920985602</a><span>|</span><a class="footer-email" href="mailto:iaayusharya@gmail.com">iaayusharya@gmail.com</a></p><p class="visitor-count" aria-live="polite"><span class="visitor-count__label">Live Footfall</span><span id="visitor-count-value" class="visitor-count__value">1,284</span></p></div><div class="social-icons"><a>Instagram</a><a>LinkedIn</a><a>Contact</a></div></footer></section></div></body>
</html>
